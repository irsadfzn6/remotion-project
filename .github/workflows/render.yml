name: Render Remotion Video

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Render video
        run: npx remotion render Slideshow out.mp4

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: remotion-video
          path: out.mp4
          retention-days: 7